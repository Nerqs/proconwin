name: build

on:
  push:
    branches: [main]
    tags: ['v*']  # tag v1.2.3 = publicar a versão 1.2.3
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build
      - name: Compilar
        run: cmake --build build --config Release
      - name: Testes
        run: ctest --test-dir build -C Release --output-on-failure

  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar
        run: cmake -S . -B build -DPROCON_BUILD_TOOLS=OFF
      - name: Compilar
        run: cmake --build build
      - name: Testes
        run: ctest --test-dir build --output-on-failure

  # Driver de kernel (ProconWinBus): guardado para quando houver assinatura
  # da Microsoft. Só compila, não entra no pacote.
  driver-kernel:
    runs-on: windows-2022
    env:
      DMF_TAG: v1.1.99
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          # O InfVerif do WDK só carrega no MSBuild de 64 bits.
          msbuild-architecture: x64
      - name: Baixar o DMF
        run: git clone --depth 1 --branch $env:DMF_TAG https://github.com/microsoft/DMF DMF
      - name: Compilar o DMF (DmfK)
        # O compilador novo gera avisos no DMF que ele trata como erro (/WX).
        # _CL_ adiciona /WX- no fim da linha de comando só neste passo.
        env:
          _CL_: /WX-
        run: msbuild DMF\Dmf.sln /m /t:"DmfK;DmfKModules_Template" /p:Configuration=Release /p:Platform=x64
      - name: Compilar o driver
        run: msbuild driver\ProconWinBus.sln /m /p:Configuration=Release /p:Platform=x64 /p:DmfRootPath=$env:GITHUB_WORKSPACE\DMF\

  # Driver em modo usuário (ProconWinXusb) + ferramentas = pacote para instalar.
  driver:
    runs-on: windows-2022
    permissions:
      contents: write  # para publicar a versão de teste (release)
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64
      - name: Compilar o driver
        run: msbuild driver\ProconWinXusb\ProconWinXusb.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Compilar as ferramentas
        run: |
          cmake -S . -B build
          cmake --build build --config Release --target procon_proto procon_virtual procon_tray procon_install
      - name: Montar o pacote
        run: |
          New-Item -ItemType Directory -Force pacote\driver | Out-Null
          $out = 'driver\bin\xusb\Release'
          Get-ChildItem -Recurse $out | Select-Object FullName
          # INF com a versão já carimbada pelo stampinf (fica na pasta do pacote
          # se existir, senão na pasta de saída).
          $inf = Get-ChildItem -Recurse $out -Filter ProconWinXusb.inf | Sort-Object { $_.FullName.Length } -Descending | Select-Object -First 1
          $dll = Get-ChildItem -Recurse $out -Filter ProconWinXusb.dll | Select-Object -First 1
          Copy-Item $inf.FullName, $dll.FullName pacote\driver
          # Catálogo sem assinatura: o instalar.ps1 assina no PC do usuário.
          $inf2cat = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter Inf2Cat.exe | Where-Object FullName -match '\\x86\\' | Sort-Object FullName -Descending | Select-Object -First 1
          & $inf2cat.FullName /driver:pacote\driver /os:10_X64 /verbose
          if ($LASTEXITCODE -ne 0) { throw "inf2cat falhou" }
          Copy-Item build\Release\procon_proto.exe, build\Release\procon_virtual.exe, build\Release\procon_tray.exe, build\Release\procon_install.exe pacote\
          Copy-Item driver\instalar.ps1, driver\desinstalar.ps1 pacote\
          Copy-Item driver\README.md pacote\LEIA-ME.md
          Copy-Item third_party\licenses -Recurse pacote\licencas
          Copy-Item LICENSE pacote\LICENSE.txt
          Get-ChildItem -Recurse pacote | Select-Object FullName
      - name: Montar o instalador
        id: instalador
        run: |
          # A versão vem do CMakeLists.txt (project(... VERSION x.y.z)).
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(proconwin VERSION ([0-9.]+)'
          $version = $m.Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $tag = $env:GITHUB_REF_NAME.Substring(1)
            if ($tag -ne $version) { throw "A tag v$tag não bate com a versão do CMakeLists.txt ($version)." }
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /Qp "/DAppVersion=$version" "/DSourceDir=$env:GITHUB_WORKSPACE\pacote" installer\proconwin.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem saida
      - uses: actions/upload-artifact@v4
        # Se a cota de armazenamento de artifacts da conta estiver cheia, o
        # upload falha mas a compilação continua valendo.
        continue-on-error: true
        with:
          name: proconwin-windows-x64
          path: |
            pacote
            saida
          retention-days: 7
      # A cota de artifacts da conta enche fácil. Versões do main também saem
      # como uma release "ultima-versao" (pré-lançamento), que não usa essa cota
      # e que o aviso de atualização do app ignora (ele só olha a última versão
      # publicada de verdade).
      - name: Publicar a última versão do main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path pacote\* -DestinationPath proconwin-windows-x64.zip -Force
          gh release delete ultima-versao --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          gh release create ultima-versao proconwin-windows-x64.zip (Get-ChildItem saida\*.exe).FullName --prerelease --target $env:GITHUB_SHA --title "Última versão (main)" --notes "Compilado automaticamente do commit $env:GITHUB_SHA. Para testar: rode o instalador, ou descompacte o zip e siga o LEIA-ME.md."
      # Tag v1.2.3: versão de verdade. É a que o aviso de atualização do app encontra.
      - name: Publicar a versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.instalador.outputs.version }}
        run: |
          Compress-Archive -Path pacote\* -DestinationPath proconwin-windows-x64.zip -Force
          $setup = (Get-ChildItem saida\*.exe).FullName
          gh release create $env:GITHUB_REF_NAME $setup proconwin-windows-x64.zip --title "ProconWin $env:VERSION" --generate-notes --latest
